
name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o Bella-Chat-Android-Tahap-1.zip -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Generate Bella launcher icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          img = Image.open("1794032586501.jpg").convert("RGBA")
          img = ImageOps.fit(img, (512, 512))

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path("extracted")
              projects = list(folder.rglob("settings.gradle.kts"))
              project = projects[0].parent

              target = project / f"app/src/main/res/mipmap-{density}"
              target.mkdir(parents=True, exist_ok=True)
              img.resize((size, size)).save(target / "ic_launcher.png")
          PY

      
      - name: Force Java and Kotlin target 17
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$FILE"

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          echo "Konfigurasi Java 17 ditambahkan."
          cat "$FILE"


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

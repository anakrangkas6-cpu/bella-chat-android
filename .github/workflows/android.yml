
name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o Bella-Chat-Android-Tahap-1.zip -d .

      - name: Set Java target to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
              1
          )
          p.write_text(s)
          PY
          
                     - name: Generate Bella app icon
          run: |
            python3 -m pip install pillow
            python3 - <<'PY'
            from PIL import Image, ImageOps
            from pathlib import Path

            img = Image.open("1794032586501.jpg").convert("RGB")
            img = ImageOps.fit(img, (512, 512), centering=(0.5, 0.35))

            sizes = {
                "mdpi": 48,
                "hdpi": 72,
                "xhdpi": 96,
                "xxhdpi": 144,
                "xxxhdpi": 192
            }

            for density, size in sizes.items():
                folder = Path(f"app/src/main/res/mipmap-{density}")
                folder.mkdir(parents=True, exist_ok=True)
                img.resize((size, size)).save(folder / "ic_launcher.png")

            manifest = Path("app/src/main/AndroidManifest.xml")
            text = manifest.read_text()
            text = text.replace(
                '<application',
                '<application android:icon="@mipmap/ic_launcher"',
                1
            )
            manifest.write_text(text)
            PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Generate Bella launcher icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          # Cari foto Bella-nya, di mana pun dia
          src = None
          for name in ["1794032586501.jpg", "bella.jpg", "icon.jpg", "bella.png"]:
              if Path(name).exists():
                  src = Path(name)
                  break
          if src is None:
              # Cari file jpg pertama yang ketemu
              jpgs = list(Path(".").rglob("*.jpg"))
              src = jpgs[0] if jpgs else None
          print(f"Foto sumber: {src}")
          img = Image.open(src).convert("RGBA")
          # Buat jadi kotak 512, biar nggak kepotong
          img = ImageOps.fit(img, (512, 512))

          # 1. Bikin icon biasa buat HP lama
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # 2. Bikin Adaptive Icon buat HP baru (INI YANG BIKIN MUNCUL)
          # Foreground = foto Bella, Background = hitam biar cantik
          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              # Foreground harus 108dp, jadi kita bikin 432x432 dengan padding
              fg_size = int(size * 108 / 48)
              fg = Image.new("RGBA", (fg_size, fg_size), (0,0,0,0))
              # Foto di tengah, dikecilin dikit biar nggak kepotong lingkaran
              inner = img.resize((int(fg_size*0.75), int(fg_size*0.75)), Image.Resampling.LANCZOS)
              fg.paste(inner, ((fg_size-inner.size[0])//2, (fg_size-inner.size[1])//2), inner)
              fg.save(folder / "ic_launcher_foreground.png")
              # Background polos
              bg = Image.new("RGBA", (fg_size, fg_size), (20, 20, 25, 255))
              bg.save(folder / "ic_launcher_background.png")

          # 3. Bikin XML adaptive-nya
          anydpi = Path("app/src/main/res/mipmap-anydpi-v26")
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
              <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')
          (anydpi / "ic_launcher_round.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>''')
          print("Ikon Bella Adaptive berhasil dibuat!")
          PY

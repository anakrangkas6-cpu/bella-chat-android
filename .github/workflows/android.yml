name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Bella-Chat-Android-Tahap-1.zip -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Generate Bella launcher icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = None
          for name in ["1794032586501.jpg", "bella.jpg", "icon.jpg", "bella.png"]:
              if Path(name).exists():
                  src = Path(name)
                  break
          if src is None:
              jpgs = list(Path(".").rglob("*.jpg"))
              src = jpgs[0] if jpgs else None
          print(f"Foto sumber: {src}")
          img = Image.open(src).convert("RGBA")
          img = ImageOps.fit(img, (512, 512))
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")
          # FIX: foreground/background di drawable, BUKAN mipmap
          for density, size in sizes.items():
              d_folder = Path(f"app/src/main/res/drawable-{density}")
              d_folder.mkdir(parents=True, exist_ok=True)
              fg_size = int(size * 108 / 48)
              fg = Image.new("RGBA", (fg_size, fg_size), (0,0,0,0))
              inner = img.resize((int(fg_size*0.75), int(fg_size*0.75)), Image.Resampling.LANCZOS)
              fg.paste(inner, ((fg_size-inner.size[0])//2, (fg_size-inner.size[1])//2), inner)
              fg.save(d_folder / "ic_launcher_foreground.png")
              bg = Image.new("RGBA", (fg_size, fg_size), (20, 20, 25, 255))
              bg.save(d_folder / "ic_launcher_background.png")
          anydpi = Path("app/src/main/res/mipmap-anydpi-v26")
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@drawable/ic_launcher_background"/>\n<foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>')
          (anydpi / "ic_launcher_round.xml").write_text('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@drawable/ic_launcher_background"/>\n<foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>')
          print("Ikon Bella Adaptive FIXED!")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          import pathlib
          files = list(pathlib.Path(".").rglob("build.gradle")) + list(pathlib.Path(".").rglob("build.gradle.kts"))
          for f in files:
              text = f.read_text()
              orig = text
              text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              text = text.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
              text = text.replace('JvmTarget = "1.8"', 'JvmTarget = "17"')
              text = text.replace('"1.8"', '"17"')
              text = text.replace("'1.8'", "'17'")
              text = text.replace("VERSION_1_8", "VERSION_17")
              text = text.replace("1_8", "17")
              if text != orig:
                  f.write_text(text)
                  print(f"DIPERBAIKI: {f}")
          PY

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Bella-Chat-Android-Tahap-1.zip -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Generate Bella launcher icon
        run: |
          python3 -m pip install pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          img = Image.open("1794032586501.jpg").convert("RGBA")
          img = ImageOps.fit(img, (512, 512))

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)

              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")

          print("Ikon Bella berhasil dibuat.")
          PY

      
      
            plugins {
                   id("com.android.application")
                            id("org.jetbrains.kotlin.android")
                                    id("org.jetbrains.kotlin.plugin.compose")
                                  }

             android {
                                 namespace = "id.bellachat.app"
                             compileSdk = 35

                                     defaultConfig {
                                       applicationId = "id.bellachat.app"
             minSdk = 26
             targetSdk = 35
              versionCode = 1
              versionName = "0.1.0"
           }

                   buildFeatures {
                     compose = true
              }

                        compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                }

                   kotlinOptions {
                    jvmTarget = "17"
                 }
                 }

                   dependencies {
                    implementation(platform("androidx.compose:compose-bom:2024.12.01"))
                    implementation("androidx.activity:activity-compose:1.10.0")
                    implementation("androidx.compose.ui:ui")
                    implementation("androidx.compose.ui:ui-tooling-preview")
                    implementation("androidx.compose.material3:material3")
                    implementation("androidx.compose.material:material-icons-extended")
                    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
                    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
                    debugImplementation("androidx.compose.ui:ui-tooling")
                }




      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error




name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Bella-Chat-Android-Tahap-1.zip -d .
          test -f app/src/main/AndroidManifest.xml

      - name: Generate Bella app icon
        run: |
          python3 -m pip install pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import xml.etree.ElementTree as ET

          image_path = Path("1794032586501.jpg")
          manifest_path = Path("app/src/main/AndroidManifest.xml")

          if not image_path.exists():
              raise FileNotFoundError("Foto Bella tidak ditemukan")

          if not manifest_path.exists():
              raise FileNotFoundError("AndroidManifest.xml tidak ditemukan")

          img = Image.open(image_path).convert("RGBA")
          img = ImageOps.fit(img, (512, 512))

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              img.resize((size, size), Image.Resampling.LANCZOS).save(
                  folder / "ic_launcher.png"
              )

          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(manifest_path)
          root = tree.getroot()

          application = root.find("application")
          if application is None:
              raise ValueError("Tag application tidak ditemukan")

          application.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")

          tree.write(
              manifest_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Ikon Bella berhasil dipasang.")
          print("AndroidManifest.xml berhasil diperbaiki.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error



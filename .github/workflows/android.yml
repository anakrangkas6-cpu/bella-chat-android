name: Build Bella Chat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Bella-Chat-Android-Tahap-1.zip -d .
          test -f app/src/main/AndroidManifest.xml
          ls -R | head -n 100

      - name: Generate Bella launcher icon
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          img = Image.open("1794032586501.jpg").convert("RGBA")
          img = ImageOps.fit(img, (512, 512))
          sizes = {"mdpi": 48,"hdpi": 72,"xhdpi": 96,"xxhdpi": 144,"xxxhdpi": 192}
          for density, size in sizes.items():
              folder = Path(f"app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
          print("Ikon Bella berhasil dibuat.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
                                                       
      - name: Fix Java and Kotlin compatibility
        run: |
          echo "=== CARI FILE NYA ==="
          find . -maxdepth 3 -name "build.gradle*" -print
          ls -R app | head -n 100

          echo "=== FIX SEMUA YANG KETEMU ==="
          for f in app/build.gradle.kts app/build.gradle build.gradle.kts build.gradle bella-chat-android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Fix file: $f"
              sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f" || true
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f" || true
              sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f" || true
              sed -i 's/JvmTarget = "1.8"/JvmTarget = "17"/g' "$f" || true
              cat "$f"
            fi
          done
          echo "=== SELESAI FIX ==="

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bella-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
